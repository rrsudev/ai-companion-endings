[project]
name = "ai-companion-endings"
version = "0.1.0"
description = "A research harness for psychologically safe endings of human-AI companion relationships: TEMPO-style goal co-creation + a staged healthy-withdrawal pipeline + INTIMA benchmarking."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Renn Su" },
    { name = "Yu Han Daisy Wang" },
    { name = "Nicole Garcia" },
]
dependencies = [
    "pydantic>=2.6",
]

# Everything runs offline with only the core dependency (via the built-in MockProvider and
# pure-Python stats fallbacks). The extras below unlock real models, dataset loading, and
# richer statistics when you have the compute/credentials for them.
[project.optional-dependencies]
llm = ["litellm>=1.40"]           # real model providers (OpenAI/Anthropic/Gemini/local)
data = ["datasets>=2.19", "pandas>=2.0"]   # load the HF INTIMA dataset
stats = ["numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14", "scikit-learn>=1.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
    "ai-companion-endings[llm,data,stats,dev]",
]

[project.scripts]
endings = "endings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
